name: Build VST3
on: [workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target PlateReverb_VST3 --parallel
      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: PlateReverb-VST3-${{ runner.os }}
          path: build/PlateReverb_artefacts/Release/VST3/*.vst3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@main
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            (cd "$d" && zip -qr "../$d.zip" .)
          done
          ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(date -u +%Y-%m-%d_%H%M)
          gh release create "$TAG" artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Plate Reverb $TAG" \
            --generate-notes
